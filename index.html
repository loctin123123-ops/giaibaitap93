<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Giải bài tập lớp 9/3</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        .chat-container { height: calc(100vh - 200px); }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
    </style>
</head>
<body class="bg-gray-100 font-sans">
    <!-- Header -->
    <header class="bg-blue-600 text-white p-4 shadow-md sticky top-0 z-50">
        <div class="container mx-auto flex justify-between items-center">
            <div class="flex items-center space-x-3">
                <i class="fas fa-graduation-cap text-2xl"></i>
                <div>
                    <h1 class="text-xl font-bold">Giải bài tập lớp 9/3</h1>
                    <p class="text-xs text-blue-200">Mọi người học giỏi để vào lớp 10 cùng nhau nhé 🚀</p>
                </div>
            </div>
            <div id="user-status" class="flex items-center space-x-3">
                <!-- Được render bằng Javascript -->
            </div>
        </div>
    </header>

    <!-- Main Container -->
    <main class="container mx-auto p-4 max-w-5xl">
        <!-- Auth Modal / Card -->
        <div id="auth-section" class="bg-white p-6 rounded-lg shadow-md max-w-md mx-auto my-10">
            <h2 id="auth-title" class="text-2xl font-bold text-center mb-6 text-gray-800">Đăng Nhập</h2>
            <form id="auth-form" onsubmit="handleAuth(event)">
                <div class="mb-4">
                    <label class="block text-gray-700 text-sm font-bold mb-2">Họ và Tên</label>
                    <input type="text" id="auth-fullname" required class="w-full p-2 border rounded focus:outline-none focus:border-blue-500" placeholder="Ví dụ: Nguyễn Văn A">
                </div>
                <div class="mb-4">
                    <label class="block text-gray-700 text-sm font-bold mb-2">Chức vụ trong lớp</label>
                    <select id="auth-role" class="w-full p-2 border rounded focus:outline-none focus:border-blue-500">
                        <option value="Học sinh">Học sinh</option>
                        <option value="Lớp trưởng">Lớp trưởng</option>
                        <option value="Lớp phó">Lớp phó</option>
                        <option value="Tổ trưởng">Tổ trưởng</option>
                    </select>
                </div>
                <button type="submit" class="w-full bg-blue-600 text-white font-bold py-2 rounded hover:bg-blue-700 transition duration-200">
                    Vào Trang Web
                </button>
            </form>
        </div>

        <!-- Main Dashboard (Ẩn khi chưa đăng nhập) -->
        <div id="dashboard" class="hidden">
            <!-- Navigation Tabs -->
            <div class="flex border-b border-gray-200 bg-white rounded-t-lg mb-4">
                <button onclick="switchTab('homework')" id="tab-homework" class="py-3 px-6 text-blue-600 font-semibold border-b-2 border-blue-600 focus:outline-none">
                    <i class="fas fa-book-open mr-2"></i>Bài Tập & Thông Báo
                </button>
                <button onclick="switchTab('chat')" id="tab-chat" class="py-3 px-6 text-gray-500 font-semibold focus:outline-none">
                    <i class="fas fa-comments mr-2"></i>Phòng Chat Lớp
                </button>
                <button onclick="switchTab('ai-tutor')" id="tab-ai-tutor" class="py-3 px-6 text-gray-500 font-semibold focus:outline-none">
                    <i class="fas fa-robot mr-2"></i>Trợ Lý AI Học Tập
                </button>
            </div>

            <!-- TAB 1: BÀI TẬP & THÔNG BÁO -->
            <div id="content-homework" class="tab-content active bg-white p-6 rounded-b-lg shadow-md">
                <div id="leader-controls" class="hidden mb-6 p-4 bg-blue-50 border border-blue-200 rounded-lg">
                    <h3 class="font-bold text-blue-800 mb-2"><i class="fas fa-plus-circle mr-2"></i>Đăng bài tập / Thông báo mới (Dành cho Ban Cán Sự)</h3>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-3 mb-3">
                        <select id="hw-subject" class="p-2 border rounded">
                            <option value="Toán">Toán</option>
                            <option value="Ngữ văn">Ngữ văn</option>
                            <option value="Tiếng Anh">Tiếng Anh</option>
                            <option value="Vật lý">Vật lý</option>
                            <option value="Hóa học">Hóa học</option>
                            <option value="Sinh học">Sinh học</option>
                            <option value="Lịch sử">Lịch sử</option>
                            <option value="Địa lý">Địa lý</option>
                            <option value="GDCD">GDCD</option>
                            <option value="Tin học">Tin học</option>
                            <option value="Công nghệ">Công nghệ</option>
                            <option value="Âm nhạc">Âm nhạc</option>
                            <option value="Mỹ thuật">Mỹ thuật</option>
                        </select>
                        <input type="text" id="hw-title" placeholder="Tiêu đề bài tập / nội dung..." class="p-2 border rounded">
                    </div>
                    <textarea id="hw-desc" placeholder="Chi tiết bài tập hoặc lời dặn..." class="w-full p-2 border rounded mb-3" rows="3"></textarea>
                    <button onclick="addHomework()" class="bg-blue-600 text-white font-bold py-2 px-4 rounded hover:bg-blue-700">Đăng Bài</button>
                </div>

                <h3 class="text-xl font-bold mb-4 text-gray-800">Danh Sách Bài Tập Cần Làm</h3>
                <div id="homework-list" class="space-y-4">
                    <!-- Danh sách bài tập render ở đây -->
                </div>
            </div>

            <!-- TAB 2: PHÒNG CHAT LỚP -->
            <div id="content-chat" class="tab-content bg-white p-6 rounded-b-lg shadow-md">
                <div class="chat-container flex flex-col justify-between">
                    <div id="chat-messages" class="overflow-y-auto p-4 space-y-3 bg-gray-50 rounded-lg border flex-grow mb-4">
                        <!-- Tin nhắn chat render ở đây -->
                    </div>
                    <div class="flex space-x-2">
                        <input type="text" id="chat-input" placeholder="Nhập tin nhắn..." class="flex-grow p-2 border rounded focus:outline-none focus:border-blue-500" onkeypress="if(event.key==='Enter') sendMessage()">
                        <button onclick="sendMessage()" class="bg-blue-600 text-white px-6 py-2 rounded font-bold hover:bg-blue-700">Gửi</button>
                    </div>
                </div>
            </div>

            <!-- TAB 3: TRỢ LÝ AI HỌC TẬP -->
            <div id="content-ai-tutor" class="tab-content bg-white p-6 rounded-b-lg shadow-md">
                <div class="text-center p-6">
                    <i class="fas fa-robot text-5xl text-blue-600 mb-4"></i>
                    <h3 class="text-2xl font-bold mb-2">Trợ Lý AI Lớp 9/3</h3>
                    <p class="text-gray-600 mb-6">Giải đáp mọi bài tập Toán, Văn, Anh, Lý, Hóa cho các bạn chuẩn bị thi vào 10!</p>
                    <div class="max-w-xl mx-auto border rounded-lg p-4 bg-gray-50 text-left">
                        <textarea id="ai-question" class="w-full p-3 border rounded mb-3" rows="4" placeholder="Nhập câu hỏi hoặc đề bài bạn cần giải..."></textarea>
                        <button onclick="askAI()" class="w-full bg-green-600 text-white font-bold py-2 rounded hover:bg-green-700">Nhờ AI Giải Giúp</button>
                        <div id="ai-answer" class="mt-4 p-4 bg-white border rounded hidden">
                            <!-- Đáp án AI -->
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="mt-12 text-center text-gray-500 text-xs py-4">
        Developer by Nguyễn Tấn Lộc | Lớp 9/3
    </footer>

    <script>
        let currentUser = null;
        let homeworks = JSON.parse(localStorage.getItem('gbt_hw')) || [];
        let messages = JSON.parse(localStorage.getItem('gbt_chat')) || [];

        // Kiểm tra phiên làm việc - MẶC ĐỊNH LÀ CHƯA ĐĂNG NHẬP DÙ Ở BẤT KỲ MÁY NÀO
        window.onload = function() {
            const savedUser = sessionStorage.getItem('gbt_current_user');
            if (savedUser) {
                currentUser = JSON.parse(savedUser);
                renderApp();
            } else {
                showAuth();
            }
        };

        function handleAuth(e) {
            e.preventDefault();
            const fullname = document.getElementById('auth-fullname').value.trim();
            const role = document.getElementById('auth-role').value;
            
            if (!fullname) return;

            currentUser = { fullname, role };
            // Lưu vào sessionStorage để mỗi tab/máy tính hoạt động độc lập
            sessionStorage.setItem('gbt_current_user', JSON.stringify(currentUser));
            renderApp();
        }

        function logout() {
            sessionStorage.removeItem('gbt_current_user');
            currentUser = null;
            location.reload();
        }

        function showAuth() {
            document.getElementById('auth-section').classList.remove('hidden');
            document.getElementById('dashboard').classList.add('hidden');
            document.getElementById('user-status').innerHTML = '';
        }

        function renderApp() {
            document.getElementById('auth-section').classList.add('hidden');
            document.getElementById('dashboard').classList.remove('hidden');

            document.getElementById('user-status').innerHTML = `
                <div class="text-right">
                    <span class="font-bold block">${currentUser.fullname}</span>
                    <span class="text-xs bg-blue-800 px-2 py-0.5 rounded">${currentUser.role}</span>
                </div>
                <button onclick="logout()" class="bg-red-500 hover:bg-red-600 text-white px-3 py-1 rounded text-xs">Đăng xuất</button>
            `;

            if (['Lớp trưởng', 'Lớp phó', 'Tổ trưởng'].includes(currentUser.role)) {
                document.getElementById('leader-controls').classList.remove('hidden');
            } else {
                document.getElementById('leader-controls').classList.add('hidden');
            }

            renderHomework();
            renderChat();
        }

        function switchTab(tabName) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            document.getElementById(`content-${tabName}`).classList.add('active');

            ['homework', 'chat', 'ai-tutor'].forEach(t => {
                const btn = document.getElementById(`tab-${t}`);
                if (t === tabName) {
                    btn.className = "py-3 px-6 text-blue-600 font-semibold border-b-2 border-blue-600 focus:outline-none";
                } else {
                    btn.className = "py-3 px-6 text-gray-500 font-semibold focus:outline-none";
                }
            });
        }

        function addHomework() {
            const subject = document.getElementById('hw-subject').value;
            const title = document.getElementById('hw-title').value.trim();
            const desc = document.getElementById('hw-desc').value.trim();

            if (!title) return alert('Vui lòng nhập tiêu đề!');

            homeworks.unshift({ id: Date.now(), subject, title, desc, author: currentUser.fullname, date: new Date().toLocaleDateString('vi-VN') });
            localStorage.setItem('gbt_hw', JSON.stringify(homeworks));
            renderHomework();

            document.getElementById('hw-title').value = '';
            document.getElementById('hw-desc').value = '';
        }

        function renderHomework() {
            const list = document.getElementById('homework-list');
            if (homeworks.length === 0) {
                list.innerHTML = `<p class="text-gray-500 text-center py-6">Chưa có bài tập nào được đăng.</p>`;
                return;
            }

            list.innerHTML = homeworks.map(hw => `
                <div class="border rounded-lg p-4 bg-gray-50 relative">
                    <span class="bg-blue-100 text-blue-800 text-xs font-semibold px-2.5 py-0.5 rounded">${hw.subject}</span>
                    <h4 class="font-bold text-lg mt-2">${hw.title}</h4>
                    <p class="text-gray-600 mt-1">${hw.desc}</p>
                    <div class="text-xs text-gray-400 mt-3 flex justify-between">
                        <span>Đăng bởi: ${hw.author}</span>
                        <span>Ngày: ${hw.date}</span>
                    </div>
                </div>
            `).join('');
        }

        function sendMessage() {
            const input = document.getElementById('chat-input');
            const text = input.value.trim();
            if (!text) return;

            messages.push({ user: currentUser.fullname, role: currentUser.role, text, time: new Date().toLocaleTimeString('vi-VN', {hour: '2-digit', minute:'2-digit'}) });
            localStorage.setItem('gbt_chat', JSON.stringify(messages));
            renderChat();
            input.value = '';
        }

        function renderChat() {
            const chatBox = document.getElementById('chat-messages');
            chatBox.innerHTML = messages.map(msg => `
                <div class="mb-2">
                    <span class="font-bold text-sm text-blue-600">${msg.user}</span>
                    <span class="text-xs text-gray-400">(${msg.role} - ${msg.time})</span>
                    <p class="bg-white p-2 rounded shadow-sm text-gray-800 mt-0.5 border inline-block max-w-full">${msg.text}</p>
                </div>
            `).join('');
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        function askAI() {
            const q = document.getElementById('ai-question').value.trim();
            if (!q) return;

            const ansBox = document.getElementById('ai-answer');
            ansBox.classList.remove('hidden');
            ansBox.innerHTML = `<i class="fas fa-spinner fa-spin mr-2"></i>AI đang suy nghĩ lời giải...`;

            setTimeout(() => {
                ansBox.innerHTML = `<strong>Lời giải từ AI Lớp 9/3:</strong><br>Đối với bài tập "${q}", hãy áp dụng kiến thức trọng tâm Lớp 9 để giải quyết. Chúc bạn học tốt để đạt kết quả cao trong kỳ thi vào 10 nhé!`;
            }, 1000);
        }
    </script>
</body>
</html>
